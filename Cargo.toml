[package]
name = "databow"
description = "A command-line tool for querying databases via ADBC"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/columnar-tech/databow"
keywords = ["database", "sql", "adbc"]
categories = ["command-line-utilities", "database"]
include = ["/src", "/themes", "build.rs", "LICENSE", "README.md"]

[dependencies]
adbc_core = "0.23.0"
adbc_driver_manager = "0.23.0"
arrow = { version = "58.1.0", features = ["chrono-tz"] }
arrow-array = "58.1.0"
arrow-cast = "58.1.0"
arrow-schema = "58.1.0"
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7.2.2"
nu-ansi-term = "0.50.3"
reedline = "0.47.0"
syntect = "5.3.0"
terminal-colorsaurus = "1.0.3"

[dev-dependencies]
tempfile = "3.27.0"
