name: continuous-integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: install dbc
        run: curl -LsSf https://dbc.columnar.tech/install.sh | sh

      - name: install duckdb driver
        run: dbc install duckdb

      - name: build
        run: cargo build

      - name: lint
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

  # Compile the Windows-only code (console Ctrl-C handling, running the pager
  # through cmd) and run the unit tests. The integration tests need bash and
  # an ADBC driver, so they only run on Linux.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: build
        run: cargo build

      - name: lint
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --bins
